name: bandu_wrong_notebook
description: Flutter client for the Bandu wrong-notebook app.
publish_to: none

version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  dio: ^5.5.0+1
  drift: ^2.20.0
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.0
  image_picker: ^1.1.2
  json_annotation: ^4.9.0
  path: ^1.9.0
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  sqlite3_flutter_libs: ^0.5.24
  webview_flutter: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  drift_dev: ^2.20.1
  flutter_lints: ^4.0.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
