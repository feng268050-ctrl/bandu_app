syntax = "proto3";

package bandu.tiji.transfer.v1;

option java_package = "com.bandu.tiji.transfer.protocol.proto";
option java_multiple_files = true;
option java_outer_classname = "ProtocolContract";

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_HELLO = 1;
  MESSAGE_TYPE_PAIRING_START = 2;
  MESSAGE_TYPE_SRP_CHALLENGE = 3;
  MESSAGE_TYPE_SRP_PROOF = 4;
  MESSAGE_TYPE_SRP_SERVER_PROOF = 5;
  MESSAGE_TYPE_IDENTITY_EXCHANGE = 6;
  MESSAGE_TYPE_IDENTITY_CONFIRMATION = 7;
  MESSAGE_TYPE_TRANSFER_OFFER = 8;
  MESSAGE_TYPE_TRANSFER_DECISION = 9;
  MESSAGE_TYPE_MANIFEST = 10;
  MESSAGE_TYPE_CHUNK_REQUEST = 11;
  MESSAGE_TYPE_DATA_CHUNK = 12;
  MESSAGE_TYPE_CHUNK_ACK = 13;
  MESSAGE_TYPE_VERIFY_RESULT = 14;
  MESSAGE_TYPE_COMMIT_READY = 15;
  MESSAGE_TYPE_COMMIT_DECISION = 16;
  MESSAGE_TYPE_TRANSFER_COMPLETE = 17;
  MESSAGE_TYPE_PROTOCOL_ERROR = 18;
  MESSAGE_TYPE_TRUSTED_SESSION_HELLO = 19;
  MESSAGE_TYPE_TRUSTED_SESSION_PROOF = 20;
}

enum ProtocolErrorCode {
  PROTOCOL_ERROR_CODE_UNSPECIFIED = 0;
  PROTOCOL_ERROR_CODE_UNSUPPORTED_VERSION = 1;
  PROTOCOL_ERROR_CODE_INVALID_MESSAGE = 2;
  PROTOCOL_ERROR_CODE_INVALID_STATE = 3;
  PROTOCOL_ERROR_CODE_AUTHENTICATION_FAILED = 4;
  PROTOCOL_ERROR_CODE_PAIRING_CODE_EXPIRED = 5;
  PROTOCOL_ERROR_CODE_TOO_MANY_ATTEMPTS = 6;
  PROTOCOL_ERROR_CODE_IDENTITY_MISMATCH = 7;
  PROTOCOL_ERROR_CODE_INTEGRITY_FAILED = 8;
  PROTOCOL_ERROR_CODE_REPLAY_DETECTED = 9;
  PROTOCOL_ERROR_CODE_OUT_OF_ORDER = 10;
  PROTOCOL_ERROR_CODE_FRAME_TOO_LARGE = 11;
  PROTOCOL_ERROR_CODE_CANCELLED = 12;
  PROTOCOL_ERROR_CODE_REJECTED = 13;
  PROTOCOL_ERROR_CODE_INTERNAL = 14;
}

message ProtocolEnvelope {
  uint32 protocol_version = 1;
  MessageType message_type = 2;
  bytes payload = 3;
}
