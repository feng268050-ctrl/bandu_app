syntax = "proto3";

package bandu.tiji.transfer.v1;

option java_package = "com.bandu.tiji.transfer.protocol.proto";
option java_multiple_files = true;
option java_outer_classname = "PortableRecordsContract";

message CollectionRecord {
  string id = 1;
  string name = 2;
  uint64 created_at_epoch_ms = 3;
  uint64 updated_at_epoch_ms = 4;
}

enum MistakeStatusRecord {
  MISTAKE_STATUS_RECORD_UNSPECIFIED = 0;
  MISTAKE_STATUS_RECORD_WRONG_ATTEMPT = 1;
  MISTAKE_STATUS_RECORD_NOT_ATTEMPTED = 2;
  MISTAKE_STATUS_RECORD_UNKNOWN = 3;
}

enum PaperLevelRecord {
  PAPER_LEVEL_RECORD_UNSPECIFIED = 0;
  PAPER_LEVEL_RECORD_A = 1;
  PAPER_LEVEL_RECORD_B = 2;
  PAPER_LEVEL_RECORD_OTHER = 3;
}

enum MasteryLevelRecord {
  MASTERY_LEVEL_RECORD_UNSPECIFIED = 0;
  MASTERY_LEVEL_RECORD_NEW = 1;
  MASTERY_LEVEL_RECORD_REVIEWING = 2;
  MASTERY_LEVEL_RECORD_MASTERED = 3;
}

message ErrorItemRecord {
  string id = 1;
  string collection_id = 2;
  string image_relative_path = 3;
  bytes image_sha256 = 4;
  uint32 image_width = 5;
  uint32 image_height = 6;
  string thumbnail_relative_path = 7;
  string question_text = 8;
  string answer_text = 9;
  string analysis = 10;
  string wrong_answer_text = 11;
  MistakeStatusRecord mistake_status = 12;
  string mistake_analysis = 13;
  string subject = 14;
  string grade_semester = 15;
  PaperLevelRecord paper_level = 16;
  string notes = 17;
  MasteryLevelRecord mastery_level = 18;
  uint64 created_at_epoch_ms = 19;
  uint64 updated_at_epoch_ms = 20;
}

message TagRecord {
  string id = 1;
  string name = 2;
  string subject = 3;
  string parent_id = 4;
  uint32 sort_order = 5;
  string code = 6;
  bool is_system = 7;
  uint64 created_at_epoch_ms = 8;
  uint64 updated_at_epoch_ms = 9;
}

message ErrorItemTagRecord {
  string error_item_id = 1;
  string tag_id = 2;
}

message TutorSessionRecord {
  string id = 1;
  string title = 2;
  string error_item_id = 3;
  uint64 created_at_epoch_ms = 4;
  uint64 updated_at_epoch_ms = 5;
}

enum TutorMessageRoleRecord {
  TUTOR_MESSAGE_ROLE_RECORD_UNSPECIFIED = 0;
  TUTOR_MESSAGE_ROLE_RECORD_USER = 1;
  TUTOR_MESSAGE_ROLE_RECORD_ASSISTANT = 2;
  TUTOR_MESSAGE_ROLE_RECORD_SYSTEM_LOCAL = 3;
}

enum TutorMessageStatusRecord {
  TUTOR_MESSAGE_STATUS_RECORD_UNSPECIFIED = 0;
  TUTOR_MESSAGE_STATUS_RECORD_COMPLETE = 1;
  TUTOR_MESSAGE_STATUS_RECORD_STOPPED = 2;
  TUTOR_MESSAGE_STATUS_RECORD_FAILED = 3;
}

message TutorMessageRecord {
  string id = 1;
  string session_id = 2;
  TutorMessageRoleRecord role = 3;
  string content = 4;
  TutorMessageStatusRecord status = 5;
  uint32 sequence = 6;
  uint64 created_at_epoch_ms = 7;
}

enum ExerciseDifficultyRecord {
  EXERCISE_DIFFICULTY_RECORD_UNSPECIFIED = 0;
  EXERCISE_DIFFICULTY_RECORD_EASY = 1;
  EXERCISE_DIFFICULTY_RECORD_MEDIUM = 2;
  EXERCISE_DIFFICULTY_RECORD_HARD = 3;
  EXERCISE_DIFFICULTY_RECORD_CHALLENGE = 4;
}

enum GradeResultRecord {
  GRADE_RESULT_RECORD_UNSPECIFIED = 0;
  GRADE_RESULT_RECORD_CORRECT = 1;
  GRADE_RESULT_RECORD_INCORRECT = 2;
  GRADE_RESULT_RECORD_NEEDS_REVIEW = 3;
}

message ExerciseRecord {
  string id = 1;
  string session_id = 2;
  string source_error_item_id = 3;
  string subject = 4;
  ExerciseDifficultyRecord difficulty = 5;
  string question_text = 6;
  string expected_answer = 7;
  string analysis = 8;
  string user_answer = 9;
  GradeResultRecord ai_result = 10;
  GradeResultRecord final_result = 11;
  string grading_feedback = 12;
  uint64 graded_at_epoch_ms = 13;
  uint64 overridden_at_epoch_ms = 14;
  uint64 created_at_epoch_ms = 15;
}

enum PortableProviderType {
  PORTABLE_PROVIDER_TYPE_UNSPECIFIED = 0;
  PORTABLE_PROVIDER_TYPE_GEMINI = 1;
  PORTABLE_PROVIDER_TYPE_OPENAI_COMPATIBLE = 2;
}

message PortablePreferencesRecord {
  string student_nickname = 1;
  string education_stage = 2;
  uint32 enrollment_year = 3;
  PortableProviderType provider_type = 4;
  string provider_display_name = 5;
  string provider_base_url = 6;
  string analysis_model = 7;
  string tutor_model = 8;
  string image_analysis_prompt = 9;
  string tutor_prompt = 10;
  string exercise_generation_prompt = 11;
  string exercise_grading_prompt = 12;
  uint32 prompt_schema_version = 13;
}

message PortableRecord {
  oneof value {
    CollectionRecord collection = 1;
    ErrorItemRecord error_item = 2;
    TagRecord tag = 3;
    ErrorItemTagRecord error_item_tag = 4;
    TutorSessionRecord tutor_session = 5;
    TutorMessageRecord tutor_message = 6;
    ExerciseRecord exercise = 7;
    PortablePreferencesRecord portable_preferences = 8;
  }
}
