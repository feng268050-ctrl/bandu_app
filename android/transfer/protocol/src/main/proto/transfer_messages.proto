syntax = "proto3";

package bandu.tiji.transfer.v1;

import "protocol.proto";

option java_package = "com.bandu.tiji.transfer.protocol.proto";
option java_multiple_files = true;
option java_outer_classname = "TransferMessagesContract";

message Hello {
  string discovery_id = 1;
  string device_name = 2;
  bytes nonce = 3;
}

message PairingStart {
  string pairing_session_id = 1;
  string identity = 2;
  bytes client_public_value = 3;
}

message SrpChallenge {
  bytes salt = 1;
  bytes server_public_value = 2;
  uint64 expires_at_epoch_ms = 3;
}

message SrpProof {
  bytes client_evidence = 1;
}

message SrpServerProof {
  bytes server_evidence = 1;
}

message IdentityExchange {
  string device_id = 1;
  string display_name = 2;
  bytes signing_public_key = 3;
  bytes proof_signature = 4;
}

message IdentityConfirmation {
  bool accepted = 1;
  string fingerprint = 2;
}

message TransferOffer {
  string session_id = 1;
  string source_device_id = 2;
  uint64 created_at_epoch_ms = 3;
  uint64 total_bytes = 4;
  uint32 total_files = 5;
  uint32 total_records = 6;
  bytes manifest_sha256 = 7;
}

message TransferDecision {
  string session_id = 1;
  bool accepted = 2;
  string reason_code = 3;
}

message RecordCounts {
  uint32 collections = 1;
  uint32 error_items = 2;
  uint32 tags = 3;
  uint32 error_item_tags = 4;
  uint32 tutor_sessions = 5;
  uint32 tutor_messages = 6;
  uint32 exercises = 7;
  uint32 portable_preferences = 8;
}

message FileEntry {
  string relative_path = 1;
  uint64 size = 2;
  bytes sha256 = 3;
  uint32 chunk_size = 4;
  uint32 chunk_count = 5;
}

message Manifest {
  uint32 schema_version = 1;
  string export_id = 2;
  repeated FileEntry files = 3;
  RecordCounts counts = 4;
  bytes records_sha256 = 5;
}

message ChunkRequest {
  string session_id = 1;
  string relative_path = 2;
  repeated uint32 missing_indexes = 3;
}

message DataChunk {
  string relative_path = 1;
  uint32 index = 2;
  bytes data = 3;
  bytes sha256 = 4;
}

enum ChunkAckStatus {
  CHUNK_ACK_STATUS_UNSPECIFIED = 0;
  CHUNK_ACK_STATUS_ACCEPTED = 1;
  CHUNK_ACK_STATUS_HASH_MISMATCH = 2;
  CHUNK_ACK_STATUS_OUT_OF_RANGE = 3;
}

message ChunkAck {
  string relative_path = 1;
  uint32 index = 2;
  ChunkAckStatus status = 3;
}

message VerifyResult {
  string session_id = 1;
  bool valid = 2;
  repeated string failure_codes = 3;
}

message CommitReady {
  string session_id = 1;
  bytes verified_manifest_sha256 = 2;
}

message CommitDecision {
  string session_id = 1;
  bool accepted = 2;
}

message TransferComplete {
  string session_id = 1;
  uint64 completed_at_epoch_ms = 2;
}

message ProtocolError {
  ProtocolErrorCode code = 1;
  string message = 2;
  bool resumable = 3;
}
